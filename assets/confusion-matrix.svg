<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="100%" height="100%" style="background-color: #ffffff; border-radius: 12px; font-family: 'Poppins', -apple-system, sans-serif;">
  <style>
    .title-text { fill: #0f172a; font-size: 14px; font-weight: 600; font-family: 'Poppins', sans-serif; }
    .subtitle-text { fill: #64748b; font-size: 11px; }
    .header-text { fill: #1e293b; font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
    .cell-val { fill: #0f172a; font-size: 15px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
    .cell-diag { fill: #1e1b4b; font-size: 16px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
    .axis-title { fill: #475569; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
    .footnote { fill: #64748b; font-size: 10.5px; }
  </style>

  <!-- Title & Meta Header -->
  <text x="35" y="32" class="title-text">Career Risk Confusion Matrix</text>
  <text x="35" y="48" class="subtitle-text">Random Forest Classification: 85.0% Overall Accuracy (N = 140)</text>

  <!-- Axis Titles -->
  <text x="310" y="80" class="axis-title" text-anchor="middle">Predicted Risk Class</text>
  
  <g transform="translate(45, 235) rotate(-90)">
    <text x="0" y="0" class="axis-title" text-anchor="middle">True Risk Class</text>
  </g>

  <!-- Column Headers -->
  <text x="210" y="105" class="header-text" text-anchor="middle">Low Risk</text>
  <text x="310" y="105" class="header-text" text-anchor="middle">Moderate</text>
  <text x="410" y="105" class="header-text" text-anchor="middle">High Risk</text>

  <!-- Row Headers -->
  <text x="145" y="165" class="header-text" text-anchor="end">Low Risk</text>
  <text x="145" y="245" class="header-text" text-anchor="end">Moderate</text>
  <text x="145" y="325" class="header-text" text-anchor="end">High Risk</text>

  <!-- Matrix Grid Cells (3 x 3) -->
  <!-- Row 1: Low Risk -->
  <rect x="165" y="125" width="90" height="70" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="210" y="166" class="cell-diag" text-anchor="middle">48</text>

  <rect x="265" y="125" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="310" y="166" class="cell-val" text-anchor="middle" fill="#64748b">4</text>

  <rect x="365" y="125" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="410" y="166" class="cell-val" text-anchor="middle" fill="#64748b">1</text>

  <!-- Row 2: Moderate Risk -->
  <rect x="165" y="205" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="210" y="246" class="cell-val" text-anchor="middle" fill="#64748b">5</text>

  <rect x="265" y="205" width="90" height="70" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="310" y="246" class="cell-diag" text-anchor="middle">41</text>

  <rect x="365" y="205" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="410" y="246" class="cell-val" text-anchor="middle" fill="#64748b">6</text>

  <!-- Row 3: High Risk -->
  <rect x="165" y="285" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="210" y="326" class="cell-val" text-anchor="middle" fill="#64748b">2</text>

  <rect x="265" y="285" width="90" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="310" y="326" class="cell-val" text-anchor="middle" fill="#64748b">3</text>

  <rect x="365" y="285" width="90" height="70" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5" />
  <text x="410" y="326" class="cell-diag" text-anchor="middle">30</text>

  <!-- Summary Note -->
  <rect x="50" y="375" width="420" height="42" rx="6" fill="#f1f5f9" />
  <text x="260" y="393" class="footnote" text-anchor="middle">Total Correctly Classified: 119 / 140 (85.0%)</text>
  <text x="260" y="408" class="footnote" text-anchor="middle">Evaluated on held-out multi-causal test cohort</text>
</svg>
